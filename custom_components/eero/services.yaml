
set_blocked_apps:
  fields:
    blocked_apps:
      required: True
      example: netflix
    target_profile:
      required: False
      example: John Doe or 1234567
    target_network:
      required: False
      example: My Network or 1234567    

list_reservations:
  fields:
    target_network:
      required: False
      example: My Network or 1234567

inspect_client:
  fields:
    mac:
      required: True
      example: "80:64:7c:e4:a0:8a"
    target_network:
      required: False
      example: My Network or 1234567

create_reservation:
  fields:
    mac:
      required: True
      example: "80:64:7c:e4:a0:8a"
    ip:
      required: True
      example: "192.168.4.52"
    description:
      required: False
      example: Deck Light Strp
    target_network:
      required: False
      example: My Network or 1234567

delete_reservation:
  fields:
    url:
      required: True
      example: /2.2/networks/1234567/reservations/abcdef
    target_network:
      required: False
      example: My Network or 1234567

rename_client:
  fields:
    mac:
      required: True
      example: "80:64:7c:e4:a0:8a"
    nickname:
      required: True
      example: Deck Light Controller
    target_network:
      required: False
      example: My Network or 1234567
